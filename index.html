<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Fellas</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #image,
        #fish {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        #image {
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
        }

        #image.fade {
            opacity: 0;
        }

        #fish {
            display: none;
        }
    </style>
</head>

<body>

    <img id="image" src="" alt="">

    <video id="fish" autoplay loop playsinline>
        <source src="fish.mp4" type="video/mp4">
    </video>

    <audio id="music"></audio>

    <script>

        /* =========================
           1 IN 25 FISH EASTER EGG
           ========================= */

        const fish = document.getElementById("fish");
        const image = document.getElementById("image");
        const music = document.getElementById("music");

        const fishMode = Math.floor(Math.random() * 25) === 0;


        /* =========================
           FISH MODE
           ========================= */

        if (fishMode) {

            // Hide the normal image
            image.style.display = "none";

            // Show the fish
            fish.style.display = "block";

            // Stop the music
            music.pause();

        }


        /* =========================
           NORMAL IMAGE MODE
           ========================= */

        else {

            const images = [
                "image1.jpg",
                "image2.jpg",
                "image3.jpg",
                "image4.jpg"
            ];

            let currentImage = 0;

            // Display the first image
            image.src = images[currentImage];


            // Change image every 10 seconds
            setInterval(() => {

                // Fade out
                image.classList.add("fade");

                setTimeout(() => {

                    // Move to next image
                    currentImage++;

                    // Loop back to first image
                    if (currentImage >= images.length) {
                        currentImage = 0;
                    }

                    // Change image
                    image.src = images[currentImage];

                    // Fade back in
                    image.classList.remove("fade");

                }, 1500);

            }, 10000);


            /* =========================
               MUSIC
               ========================= */

            const songs = [
                "1.ogg",
                "2.ogg",
                "3.ogg",
                "4.ogg"
            ];

            // Pick a random song
            function playRandomSong() {

                const randomSong =
                    Math.floor(Math.random() * songs.length);

                music.src = songs[randomSong];

                music.play();

            }

            // When a song finishes, pick another
            music.addEventListener("ended", playRandomSong);

            // Start music
            playRandomSong();

        }

    </script>

</body>
</html>
