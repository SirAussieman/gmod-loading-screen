<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Fellas</title>

    <style>
        html, body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: black;
        }

        #image,
        #fish,
        #robertloggia,
        #letsgroove,
        #myneighbourhood,
        #spiderman,
        #horse, {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            object-fit: fill;
        }

        #image {
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
        }

        #image.fade {
            opacity: 0;
        }

        #fish,
        #robertloggia,
        #letsgroove,
        #spiderman,
        #horse, {
            display: none;
        }
    </style>
</head>

<body>

    <img id="image" src="" alt="">

    <!-- Rare Fish easter egg -->
    <video id="fish" playsinline preload="none"></video>

    <!-- Rare Robert Loggia easter egg -->
    <video id="robertloggia" playsinline preload="none"></video>

    <!-- Rare Let's Groove easter egg -->
    <video id="letsgroove" playsinline preload="none"></video>

    <!-- Rare My Neighbourhood easter egg -->
    <video id="myneighbourhood" playsinline preload="none"></video>

    <!-- Rare spiderman easter egg -->
    <video id="spiderman" playsinline preload="none"></video>

    <!-- Rare horse easter egg -->
    <video id="horse" playsinline preload="none"></video>

    <!-- Normal loading music -->
    <audio id="music" preload="auto"></audio>

    <script>
        /* =========================
           ELEMENTS
           ========================= */

        const image = document.getElementById("image");
        const fish = document.getElementById("fish");
        const robertLoggia = document.getElementById("robertloggia");
        const letsgroove = document.getElementById("letsgroove");
        const myneighbourhood = document.getElementById("myneighbourhood");
        const spiderman = document.getElementById("letsgroove");
        const horse = document.getElementById("myneighbourhood");
        const music = document.getElementById("music");


        /* =========================
           IMAGE LIST
           ========================= */

        const images = [
            "1.jpg",
            "2.jpg",
            "3.jpg",
            "4.jpg",
            "5.jpg",
            "6.jpg"
        ];


        /* =========================
           MUSIC LIST
           ========================= */

        const songs = [
            "1.ogg",
            "2.ogg",
            "3.ogg",
            "4.ogg",
            "5.ogg",
            "6.ogg"
        ];


        /* =========================
           RARE VIDEO ROLLS
           ========================= */

        // All videos have a set chance depending on how many videos there are

        const videoRoll = Math.floor(Math.random() * 50) + 1;

        /* =========================
           STARTUP MODE
           ========================= */

        if (videoRoll === 1) {
            startRobertLoggia();
        }
        else if (videoRoll === 2) {
            startFish();
        }
        else if (videoRoll === 3) {
            startLetsGroove();
        }
        else if (videoRoll === 4) {
            startMyNeighbourhood();
        }
        else if (videoRoll === 5) {
            startSpiderman();
        }
        else if (videoRoll === 6) {
            startHorse();
        }
        else {
            startNormalLoading();
        }

        /* =========================
           ROBERT LOGGIA MODE
           ========================= */

        function startRobertLoggia() {

            image.style.display = "none";
            fish.style.display = "none";
            letsgroove.style.display = "none";
            myneighbourhood.style.display = "none";
            spiderman.style.display = "none";
            horse.style.display = "none";

            robertLoggia.style.display = "block";

            robertLoggia.volume = 0.2;

            // The source is only assigned if this rare event triggers.
            robertLoggia.src = "robertloggia.mp4";

            robertLoggia.addEventListener("ended", () => {
                robertLoggia.style.display = "none";
                startNormalLoading();
            }, { once: true });

            robertLoggia.play().catch(() => {});
        }


        /* =========================
           FISH MODE
           ========================= */

        function startFish() {

            image.style.display = "none";
            robertLoggia.style.display = "none";
            letsgroove.style.display = "none";
            myneighbourhood.style.display = "none";
            spiderman.style.display = "none";
            horse.style.display = "none";

            fish.style.display = "block";

            fish.volume = 0.2;

            // The source is only assigned if this rare event triggers.
            fish.src = "fish.mp4";

            fish.addEventListener("ended", () => {
                fish.style.display = "none";
                startNormalLoading();
            }, { once: true });

            fish.play().catch(() => {});
        }

        /* =========================
           LETS GROOVE MODE
           ========================= */

        function startLetsGroove() {

            image.style.display = "none";
            robertLoggia.style.display = "none";
            fish.style.display = "none";
            myneighbourhood.style.display = "none";
            spiderman.style.display = "none";
            horse.style.display = "none";

            letsgroove.style.display = "block";

            letsgroove.volume = 0.2;

            // The source is only assigned if this rare event triggers.
            letsgroove.src = "letsgroove.mp4";

            letsgroove.addEventListener("ended", () => {
                letsgroove.style.display = "none";
                startNormalLoading();
            }, { once: true });

            letsgroove.play().catch(() => {});
        }

        /* =========================
           MY NEIGHBOURHOOD MODE
           ========================= */
        
        function startMyNeighbourhood() {

            image.style.display = "none";
            robertLoggia.style.display = "none";
            fish.style.display = "none";
            letsgroove.style.display = "none";
            spiderman.style.display = "none";
            horse.style.display = "none";

            myneighbourhood.style.display = "block";

            myneighbourhood.volume = 0.2;

            // The souce is only assigned if this rare event triggers.
            myneighbourhood.src = "myneighbourhood.mp4";

            myneighbourhood.addEventListener("ended", () => {
                myneighbourhood.style.display = "none";
                startNormalLoading();
            }, { once: true });

            myneighbourhood.play().catch(() => {});
        }

        /* =========================
           SPIDERMAN MODE
           ========================= */
        
        function startSpiderman() {

            image.style.display = "none";
            robertLoggia.style.display = "none";
            fish.style.display = "none";
            letsgroove.style.display = "none";
            myneighbourhood.style.display = "none";
            horse.style.display = "none";

            spiderman.style.display = "block";

            spiderman.volume = 0.2;

            // The souce is only assigned if this rare event triggers.
            spiderman.src = "spiderman.mp4";

            spiderman.addEventListener("ended", () => {
                spiderman.style.display = "none";
                startNormalLoading();
            }, { once: true });

            spiderman.play().catch(() => {});
        }

        /* =========================
           MY NEIGHBOURHOOD MODE
           ========================= */
        
        function startHorse() {

            image.style.display = "none";
            robertLoggia.style.display = "none";
            fish.style.display = "none";
            letsgroove.style.display = "none";
            spiderman.style.display = "none";
            myneighbourhood.style.display = "none";

            horse.style.display = "block";

            horse.volume = 0.2;

            // The souce is only assigned if this rare event triggers.
            horse.src = "horse.mp4";

            horse.addEventListener("ended", () => {
                horse.style.display = "none";
                startNormalLoading();
            }, { once: true });

            horse.play().catch(() => {});
        }

        /* =========================
           NORMAL LOADING SCREEN
           ========================= */

        function startNormalLoading() {

            image.style.display = "block";

            let currentImage =
                Math.floor(Math.random() * images.length);

            // Display a random starting image.
            image.src = images[currentImage];


            /* =========================
               PRELOAD IMAGES
               ========================= */

            images.forEach((src) => {
                const preload = new Image();
                preload.src = src;
            });


            /* =========================
               IMAGE ROTATION
               ========================= */

            setInterval(() => {

                image.classList.add("fade");

                setTimeout(() => {

                    currentImage++;

                    if (currentImage >= images.length) {
                        currentImage = 0;
                    }

                    image.src = images[currentImage];

                    image.classList.remove("fade");

                }, 1500);

            }, 10000);


            /* =========================
               MUSIC
               ========================= */

            let previousSong = -1;

            function playRandomSong() {

                let randomSong;

                // Avoid playing the same song twice in a row.
                do {
                    randomSong =
                        Math.floor(Math.random() * songs.length);
                }
                while (
                    songs.length > 1 &&
                    randomSong === previousSong
                );

                previousSong = randomSong;

                music.src = songs[randomSong];

                music.play().catch(() => {});
            }

            music.addEventListener("ended", playRandomSong);

            playRandomSong();
        }
    </script>

</body>
</html>
