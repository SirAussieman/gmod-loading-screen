<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Fellas</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #image,
        #fish,
        #robertloggia {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        #image {
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
        }

        #image.fade {
            opacity: 0;
        }

        #fish,
        #robertloggia {
            display: none;
        }
    </style>
</head>

<body>

    <img id="image" src="" alt="">
    
    <video id="fish" autoplay loop playsinline>
        <source src="fish.mp4" type="video/mp4">
    </video>
    
    <video id="robertloggia" autoplay loop playsinline>
        <source src="robertloggia.mp4" type="video/mp4">
    </video>
    
    <audio id="music"></audio>

    <script>

        /* =========================
           RARE VIDEO EASTER EGGS
           ========================= */
        
        const fish = document.getElementById("fish");
        const robertLoggia = document.getElementById("robertloggia");
        const image = document.getElementById("image");
        const music = document.getElementById("music");
        
        const robertLoggiaMode = Math.floor(Math.random() * 100) === 0;
        const fishMode = !robertLoggiaMode && Math.floor(Math.random() * 25) === 0;
        
        
        /* =========================
           ROBERT LOGGIA MODE
           ========================= */
        
        if (robertLoggiaMode) {
        
            image.style.display = "none";
            fish.style.display = "none";
        
            robertLoggia.style.display = "block";
        
            // Robert Loggia volume
            robertLoggia.volume = 0.4;
        
            music.pause();
        
        }
        
        
        /* =========================
           FISH MODE
           ========================= */
        
        else if (fishMode) {
        
            image.style.display = "none";
            robertLoggia.style.display = "none";
        
            fish.style.display = "block";
        
            // Fish volume
            fish.volume = 0.4;
        
            music.pause();
        
        }
        
        
        /* =========================
           NORMAL IMAGE MODE
           ========================= */
        
        else {
        
            const images = [
                "1.jpg",
                "2.jpg",
                "3.jpg",
                "4.jpg"
            ];
        
            let currentImage = 0;
        
            image.src = images[currentImage];
        
        
            setInterval(() => {
        
                image.classList.add("fade");
        
                setTimeout(() => {
        
                    currentImage++;
        
                    if (currentImage >= images.length) {
                        currentImage = 0;
                    }
        
                    image.src = images[currentImage];
        
                    image.classList.remove("fade");
        
                }, 1500);
        
            }, 10000);
        
        
            /* =========================
               MUSIC
               ========================= */
        
            const songs = [
                "1.ogg",
                "2.ogg",
                "3.ogg",
                "4.ogg"
            ];
        
            function playRandomSong() {
        
                const randomSong =
                    Math.floor(Math.random() * songs.length);
        
                music.src = songs[randomSong];
        
                music.play();
        
            }
        
            music.addEventListener("ended", playRandomSong);
        
            playRandomSong();
        
        }

    </script>

</body>
</html>
