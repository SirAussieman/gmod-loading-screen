<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Fellas</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #image,
        #fish,
        #robertloggia {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        #image {
            opacity: 1;
            transition: opacity 1.5s ease-in-out;
        }

        #image.fade {
            opacity: 0;
        }

        #fish,
        #robertloggia {
            display: none;
        }
    </style>
</head>

<body>

    <img id="image" src="" alt="">

    <!-- Rare Fish easter egg -->
    <video id="fish" playsinline preload="none"></video>

    <!-- Rare Robert Loggia easter egg -->
    <video id="robertloggia" playsinline preload="none"></video>

    <!-- Normal loading music -->
    <audio id="music" preload="auto"></audio>

    <script>
        /* =========================
           ELEMENTS
           ========================= */

        const image = document.getElementById("image");
        const fish = document.getElementById("fish");
        const robertLoggia = document.getElementById("robertloggia");
        const music = document.getElementById("music");


        /* =========================
           IMAGE LIST
           ========================= */

        const images = [
            "1.jpg",
            "2.jpg",
            "3.jpg",
            "4.jpg"
        ];


        /* =========================
           MUSIC LIST
           ========================= */

        const songs = [
            "1.ogg",
            "2.ogg",
            "3.ogg",
            "4.ogg"
        ];


        /* =========================
           RARE VIDEO ROLLS
           ========================= */

        // Fish: 1/25 (4%)
        // Robert Loggia: 1/100 (1%)
        //
        // These rolls are independent.
        // If both happen, Robert Loggia gets priority.

        const fishRoll = Math.floor(Math.random() * 25) === 0;
        const robertLoggiaRoll = Math.floor(Math.random() * 100) === 0;


        /* =========================
           STARTUP MODE
           ========================= */

        if (robertLoggiaRoll) {
            startRobertLoggia();
        }
        else if (fishRoll) {
            startFish();
        }
        else {
            startNormalLoading();
        }


        /* =========================
           ROBERT LOGGIA MODE
           ========================= */

        function startRobertLoggia() {

            image.style.display = "none";
            fish.style.display = "none";

            robertLoggia.style.display = "block";

            robertLoggia.volume = 0.4;

            // The source is only assigned if this rare event triggers.
            robertLoggia.src = "robertloggia.mp4";

            robertLoggia.addEventListener("ended", () => {
                robertLoggia.style.display = "none";
                startNormalLoading();
            }, { once: true });

            robertLoggia.play().catch(() => {});
        }


        /* =========================
           FISH MODE
           ========================= */

        function startFish() {

            image.style.display = "none";
            robertLoggia.style.display = "none";

            fish.style.display = "block";

            fish.volume = 0.4;

            // The source is only assigned if this rare event triggers.
            fish.src = "fish.mp4";

            fish.addEventListener("ended", () => {
                fish.style.display = "none";
                startNormalLoading();
            }, { once: true });

            fish.play().catch(() => {});
        }


        /* =========================
           NORMAL LOADING SCREEN
           ========================= */

        function startNormalLoading() {

            image.style.display = "block";

            let currentImage =
                Math.floor(Math.random() * images.length);

            // Display a random starting image.
            image.src = images[currentImage];


            /* =========================
               PRELOAD IMAGES
               ========================= */

            images.forEach((src) => {
                const preload = new Image();
                preload.src = src;
            });


            /* =========================
               IMAGE ROTATION
               ========================= */

            setInterval(() => {

                image.classList.add("fade");

                setTimeout(() => {

                    currentImage++;

                    if (currentImage >= images.length) {
                        currentImage = 0;
                    }

                    image.src = images[currentImage];

                    image.classList.remove("fade");

                }, 1500);

            }, 10000);


            /* =========================
               MUSIC
               ========================= */

            let previousSong = -1;

            function playRandomSong() {

                let randomSong;

                // Avoid playing the same song twice in a row.
                do {
                    randomSong =
                        Math.floor(Math.random() * songs.length);
                }
                while (
                    songs.length > 1 &&
                    randomSong === previousSong
                );

                previousSong = randomSong;

                music.src = songs[randomSong];

                music.play().catch(() => {});
            }

            music.addEventListener("ended", playRandomSong);

            playRandomSong();
        }
    </script>

</body>
</html>
