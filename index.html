<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Fellas</title>

    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        #image {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            opacity: 1;

            transition: opacity 1.5s ease-in-out;
        }

        #image.fade {
            opacity: 0;
        }
    </style>
</head>

<body>

    <img id="image" src="" alt="">

    <audio id="music"></audio>

    <script>
        /* =========================
           IMAGES
           ========================= */

        const images = [
            "Wesker.jpg"
        ];

        let currentImage = 0;

        const image = document.getElementById("image");


        /* =========================
           IMAGE ROTATION
           ========================= */

        // Display the first image immediately
        image.src = images[currentImage];

        // Change image every 10 seconds
        setInterval(() => {

            // Fade out
            image.classList.add("fade");

            setTimeout(() => {

                // Move to the next image
                currentImage++;

                // Loop back to the first image
                if (currentImage >= images.length) {
                    currentImage = 0;
                }

                // Change the image
                image.src = images[currentImage];

                // Fade back in
                image.classList.remove("fade");

            }, 1500);

        }, 10000);


        /* =========================
           MUSIC
           ========================= */

        const songs = [
            "1.ogg",
            "2.ogg",
            "3.ogg"
        ];

        const music = document.getElementById("music");


        // Pick a random song when the page loads
        function playRandomSong() {

            const randomSong =
                Math.floor(Math.random() * songs.length);

            music.src = songs[randomSong];

            music.play();
        }


        // When a song finishes, pick another random song
        music.addEventListener("ended", playRandomSong);


        // Start the music
        playRandomSong();

    </script>

</body>
</html>
